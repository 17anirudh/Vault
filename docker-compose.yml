services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - ${POSTGRES_VOLUME}:/var/lib/postgresql

    restart: unless-stopped

volumes:
  bird_volume: